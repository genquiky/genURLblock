name: URLhaus to Little Snitch

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

concurrency:
  group: urlhaus-blocklist-update
  cancel-in-progress: false

jobs:
  update-blocklist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch API data and extract domains
        env:
          API_KEY: ${{ secrets.URL_BLOCKLIST2_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests
          from urllib.parse import urlparse

          api_key = os.environ.get("API_KEY")
          if not api_key:
              print("API_KEY is not configured")
              sys.exit(1)

          url = "https://urlhaus-api.abuse.ch/v1/urls/recent/"
          headers = {
              "Auth-Key": api_key,
              "User-Agent": "LittleSnitch-Updater-via-GitHub",
          }

          try:
              print("Fetching data from URLhaus API...")
              response = requests.get(url, headers=headers, timeout=30)
              response.raise_for_status()
              data = response.json()

              domains = set()

              for entry in data.get("urls", []):
                  full_url = entry.get("url", "")
                  hostname = urlparse(full_url).hostname
                  if hostname:
                      domains.add(hostname.lower())

              sorted_domains = sorted(domains)

              with open("blocked_domains.txt", "w", encoding="utf-8") as file:
                  file.write("# URLhaus Malware Domain Blocklist\n")
                  file.write("# Automatically updated via API\n")
                  for domain in sorted_domains:
                      file.write(f"{domain}\n")

              print(f"Successfully extracted {len(sorted_domains)} unique domains.")

          except requests.HTTPError as error:
              print(f"URLhaus API request failed: {error}")
              if 'response' in locals():
                  print(response.text[:500])
              sys.exit(1)
          except Exception as error:
              print(f"Error: {error}")
              sys.exit(1)
          PY

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add blocked_domains.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update blocklist from URLhaus API"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
