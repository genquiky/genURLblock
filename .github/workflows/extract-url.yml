name: URLhaus to Little Snitch

on:
  schedule:
    - cron: "0 8,20 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urlhaus-blocklist-update
  cancel-in-progress: false

jobs:
  update-blocklist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Fetch URLhaus data and create Little Snitch JSON
        env:
          API_KEY: ${{ secrets.URL_BLOCKLIST2_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          import requests

          export_token = os.environ.get("API_KEY")

          if not export_token:
              print("API_KEY is not configured")
              sys.exit(1)

          # This URL returns plain text, not JSON.
          url = (
              "https://urlhaus-api.abuse.ch/v2/files/exports/"
              f"{export_token}/urls_online.txt"
          )

          headers = {
              "User-Agent": "LittleSnitch-Updater-via-GitHub",
              "Accept": "text/plain",
          }

          try:
              print("Fetching data from URLhaus...")

              response = requests.get(
                  url,
                  headers=headers,
                  timeout=60,
              )
              response.raise_for_status()

              blocked_urls = set()

              # urls_online.txt contains comments and one URL per line.
              for line in response.text.splitlines():
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  blocked_urls.add(line)

              sorted_urls = sorted(blocked_urls)

              if not sorted_urls:
                  print("URLhaus returned no URLs; refusing to overwrite the blocklist")
                  sys.exit(1)
              
              updated_at = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

              little_snitch_rules = {
                  "name": "URLhaus Malware Blocklist",
                  "description": (
                      "==================================\n"
                      "URLhaus Active Malware Blocklist\n"
                      "----------------------------------------------\n"
                      f"Updated:      {updated_at}\n"
                      "Database:      "urls_online.txt" dump\n"
                      "Maintainer:   github.com/genquiky\n"
                      "Expires:        every 8 hours\n"
                      "=================================="
                  ),
                  "denied-remote-domains": sorted_urls,
              }

              with open("new_format.json", "w", encoding="utf-8") as file:
                  json.dump(
                      little_snitch_rules,
                      file,
                      indent=4,
                      ensure_ascii=False,
                  )
                  file.write("\n")

              print(
                  f"Successfully wrote {len(sorted_urls)} "
                  "Little Snitch rules to new_format.json."
              )

          except requests.HTTPError as error:
              print(f"URLhaus request failed: {error}")
              print(response.text[:500])
              sys.exit(1)

          except requests.RequestException as error:
              print(f"Network error while contacting URLhaus: {error}")
              sys.exit(1)

          except Exception as error:
              print(f"Error: {error}")
              sys.exit(1)
          PY

      - name: Commit and push updated blocklist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add new_format.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Little Snitch blocklist"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
