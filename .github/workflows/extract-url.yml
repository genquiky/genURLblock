name: URLhaus to Little Snitch

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  update-blocklist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Fetch API data and extract domains
      env:
        API_KEY: ${{ secrets.URLHAUS_API_KEY }}
      run: |
        python - <<EOF
        import requests
        import os
        from urllib.parse import urlparse

        # URLhaus API endpoint for recent malware URLs
        # We use the API key in the header for authentication
        url = "https://urlhaus-api.abuse.ch/v1/urls/recent/"
        headers = {"User-Agent": "LittleSnitch-Updater-via-GitHub"}
        
        # The API allows query parameters for the key or auth headers
        params = {"key": os.environ.get("API_KEY")}

        try:
            print("Fetching data from URLhaus API...")
            response = requests.get(url, params=params, headers=headers, timeout=30)
            response.raise_for_status()
            data = response.json()

            domains = set()
            
            # API returns a dictionary with a 'urls' list
            urls_list = data.get("urls", [])
            
            for entry in urls_list:
                full_url = entry.get("url", "")
                hostname = urlparse(full_url).hostname
                if hostname:
                    domains.add(hostname.lower())

            sorted_domains = sorted(list(domains))

            with open('blocked_domains.txt', 'w') as file:
                file.write("# URLhaus Malware Domain Blocklist\n")
                file.write("# Automatically updated via API\n")
                for domain in sorted_domains:
                    file.write(f"{domain}\n")

            print(f"Successfully extracted {len(sorted_domains)} unique domains.")

        except Exception as e:
            print(f"Error: {e}")
            exit(1)
        EOF

    - name: Commit and push
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add blocked_domains.txt
        git commit -m "Update blocklist from URLhaus API" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
